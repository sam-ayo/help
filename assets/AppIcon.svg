<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F472A0"/>
      <stop offset="1" stop-color="#C2255C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5A0E2C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- The body of a macOS app icon: 824 x 824 at (100, 100). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- The two chat bubbles, in the middle of the body. -->
  <g transform="translate(0 -30)">
  <!-- The back chat bubble. -->
  <path d="M300 300 h300 a60 60 0 0 1 60 60 v160 a60 60 0 0 1 -60 60 h-170 l-90 70 v-70 h-40 a60 60 0 0 1 -60 -60 v-160 a60 60 0 0 1 60 -60 z"
        fill="#FFFFFF" fill-opacity="0.45"/>
  <!-- The front chat bubble, with the agent mark. -->
  <g filter="url(#shadow)">
    <path d="M440 420 h290 a60 60 0 0 1 60 60 v170 a60 60 0 0 1 -60 60 h-30 v80 l-100 -80 h-160 a60 60 0 0 1 -60 -60 v-170 a60 60 0 0 1 60 -60 z"
          fill="#FFFFFF"/>
  </g>
  <g stroke="#D6336C" stroke-width="34" stroke-linecap="round" transform="translate(585 565)">
    <line x1="0" y1="-78" x2="0" y2="78"/>
    <line x1="-68" y1="-39" x2="68" y2="39"/>
    <line x1="-68" y1="39" x2="68" y2="-39"/>
  </g>
  </g>
</svg>
