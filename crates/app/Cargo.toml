[package]
name = "app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "agent-desk"
path = "src/main.rs"

[dependencies]
acp_host.workspace = true
vm.workspace = true
protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
gpui-component = "=0.7.3"
gpui-kit-assets = "0.7.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Embed the icons in debug builds too. Without this, rust-embed reads them from the
# crate source folder, and a copy of the app on another Mac shows no icons.
rust-embed = { version = "8", features = ["debug-embed"] }
